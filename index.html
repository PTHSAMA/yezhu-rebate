const CHECK_INTERVAL =
    5 * 60 * 1000;


let database = [];
let settings = {};

let currentBrand = null;
let currentResults = [];

let currentDataVersion = "";
let currentSettingsVersion = "";

let graffDatabase = [];
let currentGraffVersion = "";
let graffWarningOnly = false;

let toastTimer = null;

function buildNoCacheUrl(url) {

    const separator =
        url.includes("?")
            ? "&"
            : "?";

    return (
        url +
        separator +
        "t=" +
        Date.now()
    );
}



async function fetchJson(url) {

    const response =
        await fetch(
            buildNoCacheUrl(url),
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status +
            " : " +
            url
        );
    }

    return await response.json();
}



async function loadSettings(
    silent = false
) {

    const newSettings =
        await fetchJson(
            SETTINGS_URL
        );

    if (
        newSettings.exchange_rate === undefined ||
        newSettings.exchange_rate === null
    ) {

        throw new Error(
            "settings.json 缺少 exchange_rate"
        );
    }


    const oldVersion =
        currentSettingsVersion;


    settings =
        newSettings;


    currentSettingsVersion =
        String(
            settings.version || ""
        );


    topExchangeRate.textContent =
        Number(
            settings.exchange_rate
        ).toFixed(2);


    rateUpdateTime.textContent =
        settings.updated_at
            ? "更新\n" + settings.updated_at
            : "";


    /*
        如果是首次加载：
        自动填汇率。

        如果后台更新汇率：
        也自动把员工计算框换成新汇率。
    */

    exchangeInput.value =
        settings.exchange_rate;


    if (
        silent &&
        oldVersion &&
        oldVersion !==
            currentSettingsVersion
    ) {

        showUpdateNotice();

        /*
            如果当前已经有计算结果，
            使用新汇率重新计算。
        */

        if (
            currentBrand &&
            priceInput.value
        ) {

            calculateAll(
                false
            );
        }
    }
}



async function loadDatabase(
    silent = false
) {

    const data =
        await fetchJson(
            DATA_URL
        );


    if (
        !data ||
        !Array.isArray(
            data.brands
        )
    ) {

        throw new Error(
            "返点数据库格式错误"
        );
    }


    const oldVersion =
        currentDataVersion;


    database =
        data.brands;


    currentDataVersion =
        String(
            data.version || ""
        );


    dataStatus.textContent =
        "返点数据已加载 · " +
        database.length +
        " 个品牌";


    bottomStatus.innerHTML =
        "返点更新时间：" +
        escapeHtml(
            data.updated_at || "-"
        ) +
        "<br>" +
        "系统每5分钟自动检查最新返点与汇率";


    if (
        silent &&
        oldVersion &&
        oldVersion !==
            currentDataVersion
    ) {

        showUpdateNotice();


        /*
            如果当前已经选择品牌，
            更新为数据库里的新返点。
        */

        if (currentBrand) {

            const refreshedBrand =
                findSameBrand(
                    currentBrand
                );


            if (refreshedBrand) {

                const oldPrice =
                    priceInput.value;

                selectBrand(
                    refreshedBrand,
                    false
                );

                priceInput.value =
                    oldPrice;


                if (oldPrice) {

                    calculateAll(
                        false
                    );
                }
            }
        }
    }
}

function displayStoreName(store) {
    const map = {
        "乐天明洞": "明洞乐天免税",
        "明洞乐天": "明洞乐天免税"
    };

    return map[store] || store;
}

async function loadGraffDatabase(silent = false) {
    const data = await fetchJson(GRAFF_URL);

    if (!data || !Array.isArray(data.customers)) {
        throw new Error("GRAFF 客户意向数据格式错误");
    }

    const oldVersion = currentGraffVersion;
    graffDatabase = data.customers;
    currentGraffVersion = String(data.version || "");

    const warningCount = Number(data.warning_count || 0);

    graffDataStatus.textContent =
        "今日客户：" + graffDatabase.length +
        " 位 · 重点跟进：" + warningCount + " 位";

    graffBottomStatus.textContent =
        "更新时间：" + (data.updated_at || "-") +
        " · 每5分钟自动检查更新";

    homeGraffSummary.textContent =
        "今日 " + graffDatabase.length + " 位客户 · ⚠️ " + warningCount + " 位重点跟进";

    if (graffPage.style.display !== "none") {
        renderGraffCustomers();
    }

    if (silent && oldVersion && oldVersion !== currentGraffVersion) {
        showUpdateNotice();
    }
}

function buildGraffCardText(item) {
    const lines = [];

    lines.push((item.warning ? "⚠️ " : "") + (item.customer || "未命名客户"));

    if (item.wechat) {
        lines.push("微信号：" + item.wechat);
    }

    if (Array.isArray(item.details)) {
        item.details.forEach(detail => lines.push(detail));
    }

    return lines.join("\n");
}

function renderGraffCustomers() {
    if (!graffList) return;

    const keyword = normalizeText(graffSearchInput.value);

    const results = graffDatabase.filter(item => {
        if (graffWarningOnly && !item.warning) {
            return false;
        }

        if (!keyword) {
            return true;
        }

        const haystack = normalizeText(
            item.search_text ||
            [item.customer, item.wechat, ...(item.details || [])].join(" ")
        );

        return haystack.includes(keyword);
    });

    graffList.innerHTML = "";

    if (!results.length) {
        graffList.innerHTML = '<div class="card empty">没有找到符合条件的客户</div>';
        return;
    }

    results.forEach(item => {
        const card = document.createElement("div");
        card.className = "graff-card" + (item.warning ? " warning" : "");

        const detailsHtml = (item.details || [])
            .map(detail => '<div>' + escapeHtml(detail) + '</div>')
            .join("");

        card.innerHTML =
            '<div class="graff-card-head">' +
                '<div>' +
                    '<div class="graff-customer">' + escapeHtml(item.customer || "未命名客户") + '</div>' +
                    (item.wechat
                        ? '<div class="graff-wechat">微信号：' + escapeHtml(item.wechat) + '</div>'
                        : '') +
                '</div>' +
                (item.warning
                    ? '<div class="warning-badge">⚠️ 重点跟进</div>'
                    : '') +
            '</div>' +
            '<div class="graff-detail">' + detailsHtml + '</div>';

        const copyButton = document.createElement("button");
        copyButton.className = "graff-copy";
        copyButton.textContent = "复制客户意向";
        copyButton.addEventListener("click", () => {
            copyText(buildGraffCardText(item));
        });

        card.appendChild(copyButton);
        graffList.appendChild(card);
    });
}

function setGraffFilter(warningOnly) {
    graffWarningOnly = warningOnly;

    graffFilterAll.classList.toggle("active", !warningOnly);
    graffFilterWarning.classList.toggle("active", warningOnly);

    renderGraffCustomers();
}

async function initialLoad() {

    searchInput.disabled = true;
    searchButton.disabled = true;


    try {

        await Promise.all([
            loadSettings(false),
            loadDatabase(false),
            loadGraffDatabase(false)
        ]);


        searchInput.disabled = false;
        searchButton.disabled = false;


        searchInput.focus();


    }
    catch (error) {

        console.error(
            error
        );


        dataStatus.textContent =
            "数据加载失败";


        alert(
            "最新返点或汇率加载失败。\n\n" +
            "请稍后刷新网页。"
        );
    }
}



async function checkForUpdates() {

    try {

        await loadSettings(
            true
        );

        await loadDatabase(
            true
        );

        await loadGraffDatabase(
            true
        );

    }
    catch (error) {

        console.log(
            "自动检查更新失败：",
            error
        );
    }
}



function findSameBrand(
    oldBrand
) {

    if (!oldBrand) {
        return null;
    }


    if (oldBrand.id) {

        const byId =
            database.find(
                item =>
                    String(item.id) ===
                    String(oldBrand.id)
            );

        if (byId) {
            return byId;
        }
    }


    return database.find(
        item =>
            normalizeText(
                item.english
            ) ===
                normalizeText(
                    oldBrand.english
                ) &&
            normalizeText(
                item.chinese
            ) ===
                normalizeText(
                    oldBrand.chinese
                )
    ) || null;
}



function normalizeText(
    value
) {

    return String(
        value || ""
    )
    .replace(/\s+/g, "")
    .toUpperCase();
}



function searchBrands() {

    const keyword =
        normalizeText(
            searchInput.value
        );


    if (!keyword) {

        searchResults.style.display =
            "none";

        return;
    }


    const results =
        database
        .filter(
            item => {

                const english =
                    normalizeText(
                        item.english
                    );

                const chinese =
                    normalizeText(
                        item.chinese
                    );

                return (
                    english.includes(
                        keyword
                    ) ||
                    chinese.includes(
                        keyword
                    )
                );
            }
        )
        .slice(
            0,
            30
        );


    renderSearchResults(
        results
    );
}



function renderSearchResults(
    results
) {

    searchResults.innerHTML =
        "";

    searchResults.style.display =
        "block";


    if (
        results.length === 0
    ) {

        searchResults.innerHTML =
            '<div class="empty">' +
            '没有找到品牌' +
            '</div>';

        return;
    }


    results.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "search-item";


            const title =
                item.english ||
                item.chinese ||
                "";


            let html =
                '<div class="search-brand">' +
                escapeHtml(
                    title
                ) +
                '</div>';


            if (item.chinese) {

                html +=
                    '<div class="search-sub">' +
                    escapeHtml(
                        item.chinese
                    ) +
                    '</div>';
            }


            if (item.discount) {

                html +=
                    '<div class="discount-badge">' +
                    '会员折扣 ' +
                    formatDiscount(
                        item.discount
                    ) +
                    '</div>';
            }


            div.innerHTML =
                html;


            div.addEventListener(
                "click",
                function () {

                    selectBrand(
                        item,
                        true
                    );
                }
            );


            searchResults.appendChild(
                div
            );
        }
    );
}



function selectBrand(
    item,
    focusPrice = true
) {

    currentBrand =
        item;


    currentResults =
        [];


    searchInput.value =
        item.english ||
        item.chinese ||
        "";


    searchResults.style.display =
        "none";


    brandInfo.style.display =
        "block";


    calculatorCard.style.display =
        "block";


    resultSection.style.display =
        "none";


    brandEnglish.textContent =
        item.english || "";


    brandChinese.textContent =
        item.chinese || "";


    brandCategory.textContent =
        item.category
            ? "品类：" +
              item.category
            : "";


    if (item.discount) {

        discountInput.value =
            item.discount;


        autoDiscount.style.display =
            "block";


        autoDiscount.textContent =
            "已自动读取折扣：" +
            formatDiscount(
                item.discount
            );
    }

    else {

        discountInput.value =
            "1";


        autoDiscount.style.display =
            "none";


        autoDiscount.textContent =
            "";
    }


    const remark =
        cleanRemark(
            item.remark
        );


    if (remark) {

        brandRemark.style.display =
            "block";


        brandRemark.textContent =
            "备注：" +
            remark;
    }

    else {

        brandRemark.style.display =
            "none";


        brandRemark.textContent =
            "";
    }


    rebateGrid.innerHTML =
        "";


    const rebates =
        item.rebates || {};


    Object.entries(
        rebates
    )
    .forEach(
        ([store, rebate]) => {

            if (
                rebate === null ||
                rebate === undefined
            ) {
                return;
            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "rebate-card";


            card.innerHTML =
                '<div class="rebate-store">' +
                escapeHtml(
                    displayStoreName(store)
                ) +
                '</div>' +

                '<div class="rebate-value">' +
                formatPercent(
                    rebate
                ) +
                '</div>';


            rebateGrid.appendChild(
                card
            );
        }
    );


    /*
        每次选品牌时，
        恢复统一汇率。
    */

    if (
        settings.exchange_rate !==
            undefined
    ) {

        exchangeInput.value =
            settings.exchange_rate;
    }


    if (focusPrice) {

        setTimeout(
            () => {

                priceInput.focus();
                priceInput.select();

            },
            100
        );
    }
}



function cleanRemark(
    value
) {

    let text =
        String(
            value || ""
        ).trim();


    if (!text) {
        return "";
    }


    const normalized =
        text.replace(
            /\s+/g,
            ""
        );


    if (
        normalized ===
            "有特殊SKU" ||
        normalized ===
            "特殊SKU"
    ) {

        return "";
    }


    return text;
}



function parseDiscount(
    value
) {

    let text =
        String(
            value || ""
        )
        .trim()
        .replace(
            /\s+/g,
            ""
        );


    if (!text) {
        return 1;
    }


    if (
        text.endsWith("%")
    ) {

        const number =
            parseFloat(
                text.slice(
                    0,
                    -1
                )
            );


        if (
            !isNaN(
                number
            )
        ) {

            return (
                number / 100
            );
        }
    }


    if (
        text.endsWith("折")
    ) {

        const number =
            parseFloat(
                text.slice(
                    0,
                    -1
                )
            );


        if (
            !isNaN(
                number
            )
        ) {

            if (
                number > 10
            ) {

                return (
                    number / 100
                );
            }


            return (
                number / 10
            );
        }
    }


    const number =
        parseFloat(
            text
        );


    if (
        isNaN(number)
    ) {

        return null;
    }


    if (
        number > 1
    ) {

        return (
            number / 100
        );
    }


    return number;
}



function calculateAll(
    scroll = true
) {

    if (!currentBrand) {

        alert(
            "请先选择品牌"
        );

        return;
    }


    const price =
        parseFloat(
            priceInput.value
        );


    const exchange =
        parseFloat(
            exchangeInput.value
        );


    const discount =
        parseDiscount(
            discountInput.value
        );


    if (
        isNaN(price) ||
        price <= 0
    ) {

        alert(
            "请输入正确的原价 USD"
        );

        priceInput.focus();

        return;
    }


    if (
        isNaN(exchange) ||
        exchange <= 0
    ) {

        alert(
            "汇率错误"
        );

        exchangeInput.focus();

        return;
    }


    if (
        discount === null ||
        discount <= 0 ||
        discount > 1
    ) {

        alert(
            "请输入正确的折扣"
        );

        discountInput.focus();

        return;
    }


    currentResults =
        [];


    const rebates =
        currentBrand.rebates ||
        {};


    Object.entries(
        rebates
    )
    .forEach(
        ([store, rebate]) => {

            const rebateNumber =
                Number(
                    rebate
                );


            if (
                isNaN(
                    rebateNumber
                )
            ) {

                return;
            }


            const amount =
                price *
                (1 - rebateNumber) *
                discount *
                exchange;


            currentResults.push({
                store: store,
                rebate: rebateNumber,
                amount: amount,
                price: price,
                exchange: exchange,
                discount: discount
            });
        }
    );


    renderResults(
        scroll
    );
}



function renderResults(
    scroll = true
) {

    resultList.innerHTML =
        "";


    if (
        currentResults.length === 0
    ) {

        resultList.innerHTML =
            '<div class="empty">' +
            '当前品牌没有可计算返点' +
            '</div>';


        resultSection.style.display =
            "block";


        return;
    }


    currentResults.forEach(
        result => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "result-card";


            let formula;


            if (
                result.discount !== 1
            ) {

                formula =
                    result.price +
                    " × (1-" +
                    formatPercent(
                        result.rebate
                    ) +
                    ") × " +
                    formatDiscount(
                        result.discount
                    ) +
                    " × " +
                    result.exchange;
            }

            else {

                formula =
                    result.price +
                    " × (1-" +
                    formatPercent(
                        result.rebate
                    ) +
                    ") × " +
                    result.exchange;
            }


            card.innerHTML =

                '<div class="result-header">' +

                    '<div class="result-store">' +
                    escapeHtml(
                        displayStoreName(result.store)
                    ) +
                    '</div>' +

                    '<div class="result-rebate">' +
                    '返点 ' +
                    formatPercent(
                        result.rebate
                    ) +
                    '</div>' +

                '</div>' +

                '<div class="result-price">' +
                formatMoney(
                    result.amount
                ) +
                ' 元' +
                '</div>' +

                '<div class="result-formula">' +
                escapeHtml(
                    formula
                ) +
                '</div>';


            const copyButton =
                document.createElement(
                    "button"
                );


            copyButton.className =
                "copy-button";


            copyButton.textContent =
                "复制此店结果";


            copyButton.addEventListener(
                "click",
                function () {

                    copyText(
                        buildSingleResultText(
                            result
                        )
                    );
                }
            );


            card.appendChild(
                copyButton
            );


            resultList.appendChild(
                card
            );
        }
    );


    resultSection.style.display =
        "block";


    if (scroll) {

        setTimeout(
            () => {

                resultSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            },
            100
        );
    }
}



function buildSingleResultText(
    result
) {

    let text =
        displayStoreName(result.store) +
        "\n";


    text +=
        "返点：" +
        formatPercent(
            result.rebate
        ) +
        "\n";


    if (
        result.discount !== 1
    ) {

        text +=
            "折扣：" +
            formatDiscount(
                result.discount
            ) +
            "\n";
    }


    text +=
        "汇率：" +
        result.exchange +
        "\n";


    text +=
        "到手价格：" +
        formatMoney(
            result.amount
        ) +
        " 元";


    return text;
}



function buildAllResultsText() {

    if (
        !currentBrand ||
        currentResults.length === 0
    ) {

        return "";
    }


    const lines =
        [];


    const brandName =
        currentBrand.english ||
        currentBrand.chinese ||
        "";


    lines.push(
        brandName
    );


    if (
        currentBrand.chinese &&
        currentBrand.chinese !==
            brandName
    ) {

        lines.push(
            currentBrand.chinese
        );
    }


    if (
        currentResults.length > 0
    ) {

        lines.push(
            "汇率：" +
            currentResults[0]
                .exchange
        );
    }


    lines.push("");


    currentResults.forEach(
        (result, index) => {

            lines.push(
                displayStoreName(result.store) +
                "  " +
                formatPercent(
                    result.rebate
                )
            );


            lines.push(
                "到手价格 " +
                formatMoney(
                    result.amount
                ) +
                " 元"
            );


            if (
                index <
                currentResults.length - 1
            ) {

                lines.push("");
            }
        }
    );


    return lines.join(
        "\n"
    );
}



async function copyText(
    text
) {

    if (!text) {
        return;
    }


    try {

        await navigator
            .clipboard
            .writeText(
                text
            );


        showToast(
            "已复制"
        );
    }

    catch (error) {

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        showToast(
            "已复制"
        );
    }
}



function formatPercent(
    value
) {

    const number =
        Number(
            value
        ) * 100;


    if (
        Math.abs(
            number -
            Math.round(number)
        ) <
        0.000001
    ) {

        return (
            Math.round(
                number
            ) +
            "%"
        );
    }


    return (
        number
            .toFixed(2)
            .replace(/0+$/, "")
            .replace(/\.$/, "") +
        "%"
    );
}



function formatDiscount(
    value
) {

    const zhe =
        Number(
            value
        ) * 10;


    return (
        zhe
        .toFixed(2)
        .replace(/0+$/, "")
        .replace(/\.$/, "") +
        "折"
    );
}



function formatMoney(
    value
) {

    return Math.round(
        Number(
            value
        )
    )
    .toLocaleString(
        "zh-CN"
    );
}



function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}



function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    if (
        toastTimer
    ) {

        clearTimeout(
            toastTimer
        );
    }


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1500
        );
}



function showUpdateNotice() {

    updateNotice.style.display =
        "block";


    setTimeout(
        () => {

            updateNotice.style.display =
                "none";

        },
        2500
    );
}

discountInput.addEventListener(

);


calculateButton.addEventListener(

);


copyAllButton.addEventListener(
    "click",

    }

openRebateButton.addEventListener(

);

openGraffButton.addEventListener(

backFromRebate.addEventListener(

initialLoad();


setInterval(

    CHECK_INTERVAL
);

</script>
